version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cafe_management_system
      MYSQL_USER: cafeuser
      MYSQL_PASSWORD: cafepassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-setup.sql:/docker-entrypoint-initdb.d/database-setup.sql
    networks:
      - cafe-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:

networks:
  cafe-network:
    driver: bridge